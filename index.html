<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0f0f0f; --surface: #1a1a1a; --border: #272727;
  --text: #f0f0f0; --muted: #777; --muted2: #999;
  --accent: #FF4D00; --accent2: #FFB800; --green: #22c55e;
}
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* TOP BAR */
.top-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:1000;
  background:rgba(15,15,15,0.96); backdrop-filter:blur(12px);
}
.logo { font-family:'Syne',sans-serif; font-size:19px; font-weight:800; letter-spacing:-0.5px; }
.logo span { color:var(--accent); }
.lang-group { display:flex; gap:6px; }
.lang-btn {
  background:var(--surface); border:1px solid var(--border); color:var(--muted2);
  font-family:'Syne',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px;
  padding:8px 12px; border-radius:6px; cursor:pointer; transition:all .15s;
}
.lang-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

/* DURATION */
.dur-section { padding:16px 20px 0; }
.section-label {
  font-family:'Syne',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:12px;
}
.dur-pills { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; }
.dur-pills::-webkit-scrollbar { display:none; }
.dur-pill {
  flex-shrink:0; background:var(--surface); border:1px solid var(--border);
  color:var(--muted2); font-family:'Syne',sans-serif; font-size:13px; font-weight:700;
  padding:10px 18px; border-radius:30px; cursor:pointer; transition:all .2s; white-space:nowrap;
}
.dur-pill.active { background:var(--accent); border-color:var(--accent); color:#fff; }

/* MAP */
#map-wrap { position:relative; margin-top:16px; }
#map { width:100%; height:45vh; min-height:300px; max-height:500px; }
.leaflet-container { background:#111; }
.leaflet-tile { filter:brightness(0.65) saturate(0.5) contrast(1.15); }
.leaflet-control-zoom { display:none; }
.leaflet-control-attribution { display:none; }

/* Map overlays */
.map-stats {
  position:absolute; bottom:12px; left:12px; z-index:500;
  background:rgba(10,10,10,0.9); backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.07); border-radius:12px;
  padding:12px 16px; display:none; gap:20px; align-items:center;
}
.stat { text-align:center; }
.stat-val { font-family:'Syne',sans-serif; font-size:17px; font-weight:800; color:var(--accent); line-height:1; }
.stat-key { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-top:4px; }
.stat-divider { width:1px; height:32px; background:var(--border); }

.day-btns {
  position:absolute; top:12px; right:12px; z-index:500;
  display:none; flex-direction:column; gap:6px;
}
.day-btn {
  width:36px; height:36px; border-radius:50%;
  background:rgba(10,10,10,0.88); border:1.5px solid var(--border);
  color:var(--muted2); font-family:'Syne',sans-serif; font-size:12px; font-weight:800;
  cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s;
}
.day-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

/* PROGRESS */
.progress-wrap {
  padding:16px 20px; border-bottom:1px solid var(--border); display:none;
}
.progress-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.progress-label { font-family:'Syne',sans-serif; font-size:13px; font-weight:700; }
.progress-count { font-size:13px; color:var(--muted2); font-weight:500; }
.pbar-track { height:4px; background:var(--border); border-radius:4px; overflow:hidden; }
.pbar-fill {
  height:100%; border-radius:4px;
  background:linear-gradient(90deg, var(--accent), var(--accent2));
  transition:width .4s cubic-bezier(.4,0,.2,1);
}

/* CHECKLIST */
#checklist { padding:0 20px 100px; }

.empty { text-align:center; padding:80px 20px; color:var(--muted); }
.empty-icon { font-size:42px; margin-bottom:12px; }
.empty-text { font-family:'Syne',sans-serif; font-size:15px; font-weight:600; }

.day-group { margin-top:24px; }
.day-group-head {
  display:flex; align-items:center; gap:12px;
  padding-bottom:12px; border-bottom:1px solid var(--border);
  margin-bottom:8px; cursor:pointer;
}
.day-badge {
  font-family:'Syne',sans-serif; font-size:10px; font-weight:800;
  letter-spacing:1.5px; text-transform:uppercase;
  padding:4px 10px; border-radius:6px;
  background:var(--surface); border:1px solid var(--border); color:var(--muted2);
  transition:all .2s;
}
.day-badge.active-badge { background:var(--accent); border-color:var(--accent); color:#fff; }
.day-group-title { font-family:'Syne',sans-serif; font-size:15px; font-weight:700; }
.day-group-theme { font-size:12px; color:var(--muted); margin-left:auto; }

/* STOP CARD (Agrandie pour mobile) */
.stop-card {
  display:flex; align-items:flex-start; gap:14px;
  padding:16px 0; border-bottom:1px solid var(--border);
  cursor:pointer; transition:opacity .2s; 
  position:relative;
}
.stop-card:last-child { border-bottom:none; }
.stop-card.done { opacity:.4; }
.stop-card.done .stop-name { text-decoration:line-through; }

.stop-num {
  flex-shrink:0; width:30px; height:30px; border-radius:50%;
  background:var(--surface); border:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-family:'Syne',sans-serif; font-size:12px; font-weight:800; color:var(--muted2);
  transition:all .2s; margin-top:2px;
}
.stop-card.done .stop-num { background:var(--green); border-color:var(--green); color:#fff; font-size:14px; }

.stop-body { flex:1; min-width:0; }
.stop-name { font-family:'Syne',sans-serif; font-size:15px; font-weight:700; margin-bottom:4px; line-height:1.3; }
.stop-desc { font-size:13px; color:var(--muted2); line-height:1.6; }
.stop-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.tag {
  font-size:10px; letter-spacing:1px; text-transform:uppercase;
  padding:3px 8px; border-radius:4px; border:1px solid; font-weight:600;
}
.tag.food  { border-color:rgba(255,184,0,.35); color:#FFB800; }
.tag.view  { border-color:rgba(34,197,94,.35); color:#22c55e; }
.tag.culture { border-color:rgba(99,179,237,.35); color:#63b3ed; }
.tag.walk  { border-color:rgba(160,174,192,.28); color:#a0aec0; }
.tag.secret { border-color:rgba(255,77,0,.4); color:var(--accent); }

/* Marker styles */
.cm { 
  width:28px; height:28px; border-radius:50%;
  background:var(--accent,#FF4D00); border:2.5px solid rgba(255,255,255,0.9);
  display:flex; align-items:center; justify-content:center;
  font-family:'Syne',sans-serif; font-size:11px; font-weight:800; color:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,0.6);
}
.cm.done-m { background:#22c55e; }

/* COMPLETE BANNER */
.complete-banner {
  display:none; margin:16px 0;
  background:linear-gradient(135deg,#0d1f0d,#0a170a);
  border:1px solid rgba(34,197,94,0.25); border-radius:12px;
  padding:20px; text-align:center;
}
.complete-banner.show { display:block; animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes popIn { from{transform:scale(.9);opacity:0} to{transform:scale(1);opacity:1} }
.cb-title { font-family:'Syne',sans-serif; font-size:17px; font-weight:800; color:var(--green); margin-bottom:6px; }
.cb-sub { font-size:13px; color:#6b9; }
</style>
</head>

      montmartre:   {n:"몽마르트르",d:"사크레쾨르, 사랑해 벽, 튀를뤼르 공원(최고 뷰!), 예술가 광장. 일찍 출발.",t:["view","walk","secret"]},
      galeries:     {n:"갤러리 라파예트 + 루프탑",d:"루프탑 무료. 오페라 가르니에와 그랑 불르바르 전망 최고.",t:["view"]},
      opera:        {n:"오페라 가르니에",d:"외관이 웅장합니다. 내부는 입장권 구매 필요.",t:["culture"]},
      madeleine:    {n:"마들렌 성당",d:"놀라운 신고전주의 신전. 루아얄 거리가 아름답습니다.",t:["walk","culture"]},
      concorde:     {n:"콩코르드 광장",d:"룩소르 오벨리스크, 뒤편 센 강. 세계 최대 광장 중 하나.",t:["walk","view"]},
      champselysees:{n:"샹젤리제 거리",d:"콩코르드에서 걸어 올라가세요. 비스트로에서 커피 또는 팡오쇼콜라.",t:["walk","food"]},
      arcdetriomphe:{n:"개선문",d:"꼭대기에서 12개 대로 별 모양 뷰. 미리 예약 필수.",t:["culture","view"]},
      trocadero:    {n:"트로카데로",d:"에펠탑 클래식 포토 스팟. 정원이 센 강까지 내려갑니다.",t:["view"]},
      eiffelview:   {n:"🤫 카모엥 거리",d:"인파 없이 완벽한 에펠탑 사진. 아주 잘 지켜진 비밀.",t:["view","secret"]},
      eiffel:       {n:"에펠탑",d:"미리 예약! 밤마다 매 시 정각 반짝이는 조명 쇼 — 꼭 보세요.",t:["culture","view"]},
      seine:        {n:"센 강변",d:"부르도네 거리를 따라 에펠탑까지 센 강변 산책.",t:["walk","view"]},
      bateaumouche: {n:"바토 무슈 (유람선)",d:"1시간 센 강 유람. 야경이 아름다운 저녁에 추천.",t:["view"]},
      tuileries:    {n:"튈르리 정원",d:"콩코르드와 루브르 사이. 저 멀리 에펠탑.",t:["walk","view"]},
      louvre:       {n:"루브르 박물관",d:"다 보려 하지 마세요! 모나리자, 밀로의 비너스, 니케. 최대 2시간.",t:["culture"]},
      palaisroyal:  {n:"팔레 루아얄 & 정원",d:"뷔렌의 기둥과 아케이드 갤러리. 고급스러운 평화.",t:["walk","secret"]},
      invalides:    {n:"앵발리드 — 나폴레옹 묘",d:"황금 돔, 생루이 교회의 나폴레옹 묘.",t:["culture"]},
      luxembourg:   {n:"뤽상부르 공원",d:"파리 최고의 공원. 메디치 분수, 벌통, 인형극장.",t:["walk","secret"]},
      notredame:    {n:"노트르담 대성당",d:"2024년 재개관. 고딕 파사드와 시테 섬.",t:["culture","walk"]},
      panachement:  {n:"생트 샤펠",d:"과소평가 금지! 13세기 고딕 스테인드글라스, 세계 최고 수준.",t:["culture","secret"]},
    }
  }
};

// ──────────────────────────────────────────
// STATE
// ──────────────────────────────────────────
let curLang = 'fr';
let numDays = null;
let activeDayIdx = 0;
let checked = {};
let leafMap = null, markersLG = null, routeLG = null;

// ──────────────────────────────────────────
// MAP
// ──────────────────────────────────────────
function initMap() {
  if (leafMap) return;
  leafMap = L.map('map', {zoomControl:false, attributionControl:false}).setView([48.862,2.333],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(leafMap);
  markersLG = L.layerGroup().addTo(leafMap);
  routeLG   = L.layerGroup().addTo(leafMap);
}

function drawDay(dayIdx) {
  if (!leafMap) return;
  const struct = DAYS_STRUCT[numDays];
  if (!struct) return;
  const day = struct[dayIdx];
  if (!day) return;

  markersLG.clearLayers();
  routeLG.clearLayers();

  const pts = day.stops.map(k => COORDS[k]).filter(Boolean);

  if (pts.length > 1) {
    L.polyline(pts,{color:'#FF4D00',weight:8,opacity:0.12,lineCap:'round',lineJoin:'round'}).addTo(routeLG);
    L.polyline(pts,{color:'#FF4D00',weight:3.5,opacity:0.9,lineCap:'round',lineJoin:'round'}).addTo(routeLG);
    L.polyline(pts,{color:'#FFB800',weight:1.5,opacity:0.45,lineCap:'round',dashArray:'5 14'}).addTo(routeLG);
  }

  day.stops.forEach((k,i) => {
    const c = COORDS[k]; if (!c) return;
    const done = checked[k];
    const el = document.createElement('div');
    el.className = 'cm' + (done ? ' done-m' : '');
    el.textContent = done ? '✓' : (i+1);
    L.marker(c, {icon:L.divIcon({html:el.outerHTML,className:'',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(markersLG);
  });

  if (pts.length) leafMap.fitBounds(L.latLngBounds(pts),{padding:[35,35]});

  let km = 0;
  for (let i=1;i<pts.length;i++) km += haversine(pts[i-1],pts[i]);
  document.getElementById('s-km').textContent = km.toFixed(1);
  document.getElementById('s-stops').textContent = pts.length;
  document.getElementById('s-time').textContent = '~'+ Math.round(pts.length*0.7 + km*0.12) +'h';
  document.getElementById('map-stats').style.display = 'flex';
}

function haversine([la1,lo1],[la2,lo2]) {
  const R=6371,d=Math.PI/180;
  const dLa=(la2-la1)*d, dLo=(lo2-lo1)*d;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*d)*Math.cos(la2*d)*Math.sin(dLo/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}

// ──────────────────────────────────────────
// RENDER
// ──────────────────────────────────────────
function buildPills() {
  const c = L10N[curLang];
  document.getElementById('dur-pills').innerHTML = c.pills.map((txt,i)=>
    `<div class="dur-pill${numDays===i+1?' active':''}" onclick="selectDuration(${i+1})">${txt}</div>`
  ).join('');
}

function selectDuration(d) {
  numDays = d; activeDayIdx = 0; checked = {};
  buildPills();
  initMap();
  renderAll();
}

function renderAll() {
  renderDayBtns();
  drawDay(activeDayIdx);
  renderChecklist();
  updateProgress();
}

function renderDayBtns() {
  const el = document.getElementById('day-btns');
  const struct = DAYS_STRUCT[numDays]||[];
  if (struct.length <= 1) { el.style.display='none'; return; }
  el.style.display='flex';
  el.innerHTML = struct.map((_,i)=>
    `<button class="day-btn${i===activeDayIdx?' active':''}" onclick="switchDay(${i})">J${i+1}</button>`
  ).join('');
}

function switchDay(idx) {
  activeDayIdx = idx;
  renderDayBtns();
  drawDay(idx);
  renderChecklist();
  updateProgress();
}

function renderChecklist() {
  const c = L10N[curLang];
  const struct = DAYS_STRUCT[numDays];
  if (!struct) return;

  let html = '';
  struct.forEach((day, di) => {
    const isActive = di === activeDayIdx;
    const dt = c.day_titles[day.k] || ['Jour',''];
    html += `<div class="day-group">
      <div class="day-group-head" onclick="switchDay(${di})">
        <span class="day-badge${isActive?' active-badge':''}">Jour ${di+1}</span>
        <span class="day-group-title">${dt[0]}</span>
        <span class="day-group-theme">${dt[1]}</span>
      </div>`;

    if (isActive) {
      day.stops.forEach((key, si) => {
        const s = c.stops[key]; if (!s) return;
        const done = checked[key];
        html += `<div class="stop-card${done?' done':''}" onclick="toggle('${key}')">
          <div class="stop-num">${done ? '✓' : si+1}</div>
          <div class="stop-body">
            <div class="stop-name">${s.n}</div>
            <div class="stop-desc">${s.d}</div>
            <div class="stop-tags">${(s.t||[]).map(t=>`<span class="tag ${t}">${c.tags[t]||t}</span>`).join('')}</div>
          </div>
        </div>`;
      });

      const dayDone = day.stops.every(k => checked[k]);
      html += `<div class="complete-banner${dayDone?' show':''}">
        <div class="cb-title">${c.ok_title}</div>
        <div class="cb-sub">${c.ok_sub}</div>
      </div>`;
    }

    html += `</div>`;
  });

  document.getElementById('checklist').innerHTML = html;
  document.getElementById('progress-wrap').style.display = 'block';
}

function toggle(key) {
  checked[key] = !checked[key];
  renderChecklist();
  updateProgress();
  drawDay(activeDayIdx);
}

function updateProgress() {
  const struct = DAYS_STRUCT[numDays]; if (!struct) return;
  let total=0, done=0;
  struct.forEach(d => d.stops.forEach(k => { total++; if(checked[k]) done++; }));
  document.getElementById('prog-count').textContent = `${done} / ${total}`;
  document.getElementById('pbar').style.width = (total ? Math.round(done/total*100) : 0) + '%';
}

// ──────────────────────────────────────────
// LANGUAGE (Mise à jour instantanée ajoutée)
// ──────────────────────────────────────────
function setLang(l) {
  curLang = l;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active',
      (l==='fr'&&b.textContent==='FR')||(l==='en'&&b.textContent==='EN')||(l==='ko'&&b.textContent==='한국어'));
  });
  const c = L10N[l];
  document.getElementById('lbl-how-long').textContent = c.how_long;
  document.getElementById('lbl-km').textContent = c.km;
  document.getElementById('lbl-stops').textContent = c.stops;
  document.getElementById('lbl-hours').textContent = c.hours;
  document.getElementById('lbl-progress').textContent = c.progress;
  document.getElementById('lbl-choose').textContent = c.choose;
  
  buildPills();
  
  // Si l'utilisateur a déjà choisi une durée, on redessine tout instantanément
  if (numDays) { 
    renderAll(); 
  }
}

// ──────────────────────────────────────────
// BOOT
// ──────────────────────────────────────────
window.addEventListener('load', () => {
  buildPills();
  initMap();
  leafMap.setView([48.862,2.333],13);
});
</script>
